name: Verify science and hosted learning routes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Scientific, learning and navigation checks
        run: python verification/run_checks.py
      - name: Install browser for hosted-rendering verification
        run: |
          python -m pip install -r verification/requirements-render.txt
          python -m playwright install --with-deps chromium
      - name: Inspect actual hosted GitHub pages
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python verification/check_hosted.py
      - name: Save exact checked source
        if: always()
        run: |
          mkdir -p verification/local_results
          git archive --format=tar.gz HEAD > verification/local_results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/local_results/
          retention-days: 7
